<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resultado · Quiz Uzbequistão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <div class="card">
      <p class="eyebrow">Pronto</p>
      <h1 class="title">Seu resultado</h1>
      <p id="mensagem-resultado" class="lead"></p>
      <div id="score-badge" class="score-badge"></div>
      <div class="result-actions">
        <a class="btn btn-primary" id="opiniaoLink" href="opiniao.html">Dizer o que achei</a>
        <button class="btn btn-ghost" type="button" id="refazerBtn">Refazer quiz</button>
        <button class="btn btn-ghost" type="button" id="voltarInicioBtn">Voltar ao início</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
