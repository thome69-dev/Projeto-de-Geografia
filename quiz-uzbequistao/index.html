<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Início · Quiz Uzbequistão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <div class="card">
      <p class="eyebrow">Geografia</p>
      <h1 class="title">Quiz do <span class="accent">Uzbequistão</span></h1>
      <p class="lead">Digite seu nome para começar. São 5 perguntas curtas.</p>

      <form id="form-nome" class="stack">
        <label class="label" for="nome">Seu nome</label>
        <input id="nome" name="nome" class="input" type="text" placeholder="Ex: Lucas" autocomplete="name" required>
        <button class="btn btn-primary" type="submit">Começar o quiz</button>
      </form>

      <p class="foot-link">
        <a href="comentarios.html">Ver o que as pessoas acharam</a>
      </p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
